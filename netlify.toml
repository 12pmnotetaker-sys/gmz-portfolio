[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# notify-unlock.mjs emails GMZ when someone enters the consultation code. It is
# inert unless RESEND_API_KEY and NOTIFY_EMAIL_TO are set, so previews and local
# runs never send mail.
[functions]
  directory = "netlify/functions"

# Astro emits a static 404.html; Netlify serves it automatically.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Hashed asset filenames are content-addressed, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
